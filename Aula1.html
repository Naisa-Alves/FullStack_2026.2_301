<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Resumo Aula 1 - Estrutura HTML</title>
</head>
<body>
  <h1>Aula 1: Conceitos de HTML</h1>
  <p>HTML é utilizado para estruturar todo o conteúdo de uma página web.</p>
  
  <h2>Principais Tags Aprendidas:</h2>
  <ul>
    <li>&lt;h1&gt; até &lt;h6&gt; - Cabeçalhos/Títulos</li>
    <li>&lt;p&gt; - Parágrafos de texto</li>
    <li>&lt;a&gt; - Links hipertexto</li>
    <li>&lt;ul&gt; e &lt;li&gt; - Listas não ordenadas</li>
  </ul>
</body>
</html>
